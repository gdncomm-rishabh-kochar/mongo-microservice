spring.application.name=mongo-microservice
spring.data.mongodb.uri=mongodb://appUser:app123@mongodb-psmdb-db-rs0.mongodbns.svc.cluster.local:27017/testDB?replicaSet=rs0&authSource=admin

#server.port=8081

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.com.mongo=INFO
logging.level.org.springframework.data.mongodb=INFO

# Solr
solr.enabled=${SOLR_ENABLED:true}
solr.url=${SOLR_URL:http://172.16.4.6:8983/solr}
solr.collection=${SOLR_COLLECTION:articles}
solr.products-collection=${SOLR_PRODUCTS_COLLECTION:products}
solr.connection-timeout=${SOLR_CONNECTION_TIMEOUT:5000}
solr.read-timeout=${SOLR_READ_TIMEOUT:10000}

# Kafka
kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=172.16.4.2:9092,172.16.4.5:9092,172.16.4.3:9092
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:test-mongo-microservice-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mongo.mongomicroservice.dto.kafka

kafka.topic.product=${KAFKA_TOPIC_PRODUCT:product-created}

# Redis
spring.data.redis.password=${REDIS_PASSWORD:10cent-redis}
# For K8s: override with env vars REDIS_SENTINEL_MASTER / REDIS_SENTINEL_NODES
spring.data.redis.sentinel.master=${REDIS_SENTINEL_MASTER:tenmaster}
spring.data.redis.sentinel.nodes=${REDIS_SENTINEL_NODES:my-redis.redis-sentinel.svc.cluster.local:26379}

# Redis Pub/Sub
redis.publisher.topic=${REDIS_PUBLISHER_TOPIC:publisher-events}
