spring.application.name=mongo-microservice
spring.data.mongodb.uri=${MONGODB_URI:mongodb://tencent:tencent@172.16.4.58:27017/tencent?authSource=tencent}

server.port=8081

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.com.mongo=INFO
logging.level.org.springframework.data.mongodb=INFO

# Solr
solr.enabled=${SOLR_ENABLED:true}
solr.url=${SOLR_URL:http://172.16.4.6:8983/solr}
solr.collection=${SOLR_COLLECTION:articles}
solr.products-collection=${SOLR_PRODUCTS_COLLECTION:products}
solr.connection-timeout=${SOLR_CONNECTION_TIMEOUT:5000}
solr.read-timeout=${SOLR_READ_TIMEOUT:10000}

# Kafka
kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=172.16.4.2:9092,172.16.4.5:9092,172.16.4.3:9092
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:test-mongo-microservice-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mongo.mongomicroservice.dto.kafka

kafka.topic.product=${KAFKA_TOPIC_PRODUCT:product-created}
