spring.application.name=mongo-microservice
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mongomicroservice}

server.port=8080

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.com.mongo=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Solr
solr.url=${SOLR_URL:http://localhost:8983/solr}
solr.collection=${SOLR_COLLECTION:articles}
solr.products-collection=${SOLR_PRODUCTS_COLLECTION:products}
solr.connection-timeout=${SOLR_CONNECTION_TIMEOUT:5000}
solr.read-timeout=${SOLR_READ_TIMEOUT:10000}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:mongo-microservice-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mongo.mongomicroservice.dto.kafka

kafka.topic.product=${KAFKA_TOPIC_PRODUCT:product-events}
